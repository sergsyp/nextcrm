name: Transfer SMTP secrets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/transfer-smtp-secrets.yml

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    env:
      SMTP_STAGE: ${{ secrets.YANDEX_SMTP_PASSWORD_STAGE }}
      SMTP_PROD: ${{ secrets.YANDEX_SMTP_PASSWORD_PROD }}
    steps:
      - name: Encrypt secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SMTP_STAGE"
          test -n "$SMTP_PROD"
          umask 077
          printf '%s' '' | base64 -d > public.pem
          printf '%s' "$SMTP_STAGE" | openssl pkeyutl -encrypt -pubin -inkey public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out stage.enc
          printf '%s' "$SMTP_PROD" | openssl pkeyutl -encrypt -pubin -inkey public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out prod.enc
          unset SMTP_STAGE SMTP_PROD
          rm -f public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: smtp-secrets-encrypted
          path: |
            stage.enc
            prod.enc
          retention-days: 1
          if-no-files-found: error
