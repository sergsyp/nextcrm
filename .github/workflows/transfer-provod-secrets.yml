name: Transfer provod.ai secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transfer-provod-secrets.yml

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets for the NextCRM server
        env:
          PROVOD_STAGE_API_KEY: ${{ secrets.PROVOD_STAGE_API_KEY }}
          PROVOD_PROD_API_KEY: ${{ secrets.PROVOD_PROD_API_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 encrypted
          printf '%s\n' \
            '-----BEGIN PUBLIC KEY-----' \
            'MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAj/ClzF24eAdtjuNzcP+z' \
            'S6sxZ47FqUDoWlEqgJ9S5dx8IJ9oDjeabbFjFvIqc8VPAMFddiGN2zso+gq5XK7Q' \
            'sfEE8ipOtmVt6mSRrdR60CI3p5ePFBaewhBpPVE86YKC9pmVvPFA6LwvI8LvpWfp' \
            'cWZSfZsFmE+3LuRnWe5GKYrppauFJ5IT1IM7E4v0YgxknYBCj2VbJih+6SCEAoTf' \
            '5RjFHsBRp0u5HGjMuJdud9JlaZUY7MUzDRrRw6E5gUoNgyUzfdy1TYztNTNCfSYD' \
            'iHDIOYvTPDJPXsxAFjwcdy6HeD0kX7PFidqBNEi9yZ4zqDxW6xh1T07B78it9CMr' \
            'OxsBjRiWrIm5bP2FRF+q0ikG+QRSYJXe1jdY5QkQDzD/sZfoVkzU7l+jcXY5VgY2' \
            'HXisQj9JUu2H8VeE2ZD5cZ2nM3RE9dSM29tupHwJBYnF3sbqohtDo0A3cc4uHOzp' \
            'PZ/UatRi5kAPdc1eIQTp/jPcbkxuGo1YM+sZqh7FQ08PAgMBAAE=' \
            '-----END PUBLIC KEY-----' > encrypted/server.pub
          test -n "$PROVOD_STAGE_API_KEY"
          test -n "$PROVOD_PROD_API_KEY"
          printf '%s' "$PROVOD_STAGE_API_KEY" |
            openssl pkeyutl -encrypt -pubin -inkey encrypted/server.pub \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -out encrypted/provod-stage.key.enc
          printf '%s' "$PROVOD_PROD_API_KEY" |
            openssl pkeyutl -encrypt -pubin -inkey encrypted/server.pub \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -out encrypted/provod-prod.key.enc
          rm encrypted/server.pub

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: provod-secrets-encrypted
          path: encrypted/*.enc
          retention-days: 1
          if-no-files-found: error
